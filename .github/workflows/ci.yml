name: OpenWrt owfeed CI

on:
  push:
    branches: [master, dev/ru-resilience, dev/trim-target-matrix]
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native OpenWrt packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y jq file binutils

      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Source checks and Go tests
        run: |
          sh tools/check-sources.sh
          go test ./...

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          export CGO_ENABLED=0 GOOS=linux
          COMMON=(-trimpath -buildvcs=false -tags "netgo osusergo" -ldflags="-s -w -buildid=")

          GOARCH=amd64 go build "${COMMON[@]}" -o build/opera-proxy-amd64 .
          GOARCH=arm64 go build "${COMMON[@]}" -o build/opera-proxy-arm64 .
          GOARCH=arm GOARM=7 go build "${COMMON[@]}" -o build/opera-proxy-arm .
          GOARCH=mips GOMIPS=softfloat go build "${COMMON[@]}" -o build/opera-proxy-mips .
          GOARCH=mipsle GOMIPS=softfloat go build "${COMMON[@]}" -o build/opera-proxy-mipsle .

          file build/*
          readelf -h build/opera-proxy-mips | grep -E 'Class:.*ELF32|Data:.*big endian|Machine:.*MIPS'
          readelf -h build/opera-proxy-mipsle | grep -E 'Class:.*ELF32|Data:.*little endian|Machine:.*MIPS'

      - name: UPX ROM-size optimization (x86_64 verified only)
        shell: bash
        run: |
          set -euxo pipefail
          UPX_VERSION=5.2.1
          curl -fL --retry 3 -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          mkdir -p /tmp/upx-bin
          tar -xJf /tmp/upx.tar.xz -C /tmp/upx-bin
          export UPX_BIN="/tmp/upx-bin/upx-${UPX_VERSION}-amd64_linux/upx"
          sh tools/pack-upx.sh build/opera-proxy-amd64 run-version
          # MIPS32 remains uncompressed until real-device ROM/RAM/startup testing.

      - name: Stage OpenWrt roots
        run: |
          BIN_AMD64="$PWD/build/opera-proxy-amd64"           BIN_ARM64="$PWD/build/opera-proxy-arm64"           BIN_ARM="$PWD/build/opera-proxy-arm"           BIN_MIPS="$PWD/build/opera-proxy-mips"           BIN_MIPSLE="$PWD/build/opera-proxy-mipsle"           ./tools/stage.sh

      - name: Build APKv3 and IPK with owfeed
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          owfeed plan
          owfeed check
          owfeed build
          sh tools/check-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opera-proxy-owfeed-packages
          path: dist/
          if-no-files-found: error

  verify:
    name: Install in real OpenWrt userspace
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opera-proxy-owfeed-packages
          path: dist/

      - uses: owfeed/owlab/setup@v0.6.5
        with:
          version: v0.6.5

      - name: OpenWrt 25.12 APKv3
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "25.12.5"
          install: dist/x86_64/luci-app-opera-proxy-*.apk
          assert: |
            package luci-app-opera-proxy
            file /usr/bin/opera-proxy
            file /etc/init.d/opera-proxy
            file /etc/config/opera-proxy
            file /usr/share/luci/menu.d/luci-app-opera-proxy.json
            file /www/luci-static/resources/view/opera-proxy/config.js
            file /usr/libexec/opera-proxy-probe
            exec sh -n /usr/libexec/opera-proxy-probe
            exec /usr/bin/opera-proxy -version >/dev/null
            exec uci -q get opera-proxy.main.api_proxy_builtin | grep -qx 1

      - name: OpenWrt 24.10 IPK
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "24.10.8"
          install: dist/x86_64/luci-app-opera-proxy_*.ipk
          assert: |
            package luci-app-opera-proxy
            file /usr/bin/opera-proxy
            file /etc/init.d/opera-proxy
            file /etc/config/opera-proxy
            file /usr/share/rpcd/acl.d/luci-app-opera-proxy.json
            file /usr/libexec/opera-proxy-probe
            exec sh -n /usr/libexec/opera-proxy-probe
            exec /usr/bin/opera-proxy -version >/dev/null
            exec uci -q get opera-proxy.main.api_proxy_max | grep -qx 60


  release-preflight:
    name: Release signing preflight
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify committed public signing keys
        run: |
          set -eu
          test -s keys/opera-proxy-sign.pub.pem || {
            echo 'missing keys/opera-proxy-sign.pub.pem; run tools/setup-keys.sh once and commit the public keys'
            exit 1
          }
          test -s keys/opera-proxy-release.pub || {
            echo 'missing keys/opera-proxy-release.pub; run tools/setup-keys.sh once and commit the public keys'
            exit 1
          }

  release:
    name: Sign and publish
    needs: [build, verify, release-preflight]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.1
    secrets:
      sign-key: ${{ secrets.OPERA_PROXY_SIGN_KEY }}
      usign-key: ${{ secrets.OPERA_PROXY_USIGN_KEY }}
    with:
      owfeed-version: v0.5.1
      artifact: opera-proxy-owfeed-packages
      verify-with: keys/opera-proxy-release.pub
